name: Release
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --all-targets

      - name: Publish grove-core
        run: cargo publish -p grove-core --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      - name: Wait for crates.io index
        run: |
          echo "Waiting for grove-core to appear on crates.io index..."
          for i in $(seq 1 30); do
            if cargo search grove-core 2>/dev/null | grep -q "grove-core"; then
              echo "grove-core is indexed."
              exit 0
            fi
            echo "Attempt $i/30: not yet indexed, waiting 10s..."
            sleep 10
          done
          echo "Timeout waiting for grove-core index"
          exit 1

      - name: Publish grove-cli
        run: cargo publish -p grove-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
